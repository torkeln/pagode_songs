name: Build ChordPro Songbook

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Ensure submodules are initialized
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
          echo "Submodule status:"
          git submodule status --recursive

      - name: Debug workspace (show chordpro presence)
        run: |
          echo "Top-level files:"
          ls -la
          echo ""
          echo "chordpro directory listing:"
          ls -la chordpro || true
          echo ""
          echo "chordpro/script directory listing:"
          ls -la chordpro/script || true

      - name: Make chordpro script executable if present
        run: |
          if [ -f chordpro/script/chordpro ]; then
            echo "Found chordpro script, making executable"
            chmod +x chordpro/script/chordpro
          else
            echo "No chordpro script found at chordpro/script/chordpro"
          fi

      - name: Install packages needed for build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential perl rsync cmake ninja-build \
            texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended \
            texlive-fonts-extra

      - name: Set up Python and install Meson and Ninja
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install Meson and Ninja via pip
        run: |
          python -m pip install --upgrade pip
          pip install meson ninja

      - name: Configure build (Meson)
        run: |
          meson setup builddir --reconfigure || meson setup builddir

      - name: Build (ninja via meson)
        run: |
          meson compile -C builddir

      - name: Upload songbook PDFs
        uses: actions/upload-artifact@v4
        with:
          name: songbook-pdfs
          path: builddir/*.pdf

