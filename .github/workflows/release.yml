name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release'
        required: true
        default: 'v1.0.0'

jobs:
  create-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y perl meson ninja-build
        
    - name: Install ChordPro
      run: |
        sudo cpan -T App::Music::ChordPro
        
    - name: Build songbook
      run: |
        meson setup builddir
        meson compile -C builddir
        
    - name: Create release package
      run: |
        mkdir -p release
        cp builddir/*.pdf release/
        cp song_book_pagode.cho release/
        cp cavaquinho_dgbd.json release/
        cp README.md release/ 2>/dev/null || echo "README.md not found, skipping"
        
        # Create individual instrument packages
        mkdir -p release/guitar release/mandolin release/cavaquinho
        cp builddir/*guitar*.pdf release/guitar/ 2>/dev/null || true
        cp builddir/*mandolin*.pdf release/mandolin/ 2>/dev/null || true  
        cp builddir/*cavaquinho*.pdf release/cavaquinho/ 2>/dev/null || true
        
        # Create zip packages
        cd release
        zip -r ../songbook-complete.zip *
        [ -f guitar/*.pdf ] && zip -r ../songbook-guitar.zip guitar/*.pdf song_book_pagode.cho
        [ -f mandolin/*.pdf ] && zip -r ../songbook-mandolin.zip mandolin/*.pdf song_book_pagode.cho  
        [ -f cavaquinho/*.pdf ] && zip -r ../songbook-cavaquinho.zip cavaquinho/*.pdf song_book_pagode.cho cavaquinho_dgbd.json
        cd ..
        
    - name: Get tag name
      id: tag
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "tag_name=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
        else
          echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        fi
        
    - name: List release files
      run: |
        echo "Release files to be uploaded:"
        ls -la *.zip 2>/dev/null || echo "No zip files found"
        ls -la builddir/*.pdf 2>/dev/null || echo "No PDF files found"
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag_name }}
        name: Songbook Release ${{ steps.tag.outputs.tag_name }}
        draft: false
        prerelease: false
        files: |
          songbook-complete.zip
          songbook-guitar.zip
          songbook-mandolin.zip  
          songbook-cavaquinho.zip
          builddir/song_book_pagode_guitar.pdf
          builddir/song_book_pagode_mandolin.pdf
          builddir/song_book_pagode_cavaquinho.pdf
        body: |
          ## ChordPro Songbook Release ${{ steps.tag.outputs.tag_name }}
          
          ### 📁 Release Contents
          
          **Individual PDFs:**
          - `song_book_pagode_guitar.pdf` - Guitar version (EADGBE tuning)
          - `song_book_pagode_mandolin.pdf` - Mandolin version (GDAE tuning)  
          - `song_book_pagode_cavaquinho.pdf` - Cavaquinho version (Brazilian DGBD tuning)
          
          **Package Downloads:**
          - `songbook-complete.zip` - All PDFs + source files + configurations
          - `songbook-guitar.zip` - Guitar PDF + ChordPro source
          - `songbook-mandolin.zip` - Mandolin PDF + ChordPro source
          - `songbook-cavaquinho.zip` - Cavaquinho PDF + source + custom config
          
          ### 🎵 Songs Included
          - **Canta Canta Minha Gente** - Traditional Brazilian
          - **Cheia de Manias** - Raça Negra  
          - **Marinheiro Só** - Traditional
          - **Deidres Samba** - Cornelis Vreeswijk
          - **Somliga Går Med Trasiga Skor** - Cornelis Vreeswijk
          
          ### 🎸 Instrument Features
          - **Guitar**: Standard 6-string chord diagrams
          - **Mandolin**: 4-string GDAE tuning with proper fingerings
          - **Cavaquinho**: Authentic Brazilian DGBD tuning with complete chord library
          
          ### 🔧 Technical Details
          - Generated with ChordPro and Meson build system
          - Professional chord diagrams and formatting
          - Multi-language support (Portuguese/Swedish)
          - Minor 7th chords included for all instruments
          
          ---
          *Built automatically with GitHub Actions CI/CD*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}